# Welcome to Jekyll!
#
# This config file is meant for settings that affect your entire site, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# `jekyll serve`. If you change this file, please restart the server process.

# Site Settings
locale                   : "en-US"
title                    : "Ingmar Sturm"
title_separator          : "|"
name                     : &name "Ingmar Sturm"
description              : &description "Survey methodology and data quality consulting. I help research and insights teams prevent bad data, expensive fieldwork mistakes, and unreliable analysis."
url                      : https://ingmarsturm.com
baseurl                  : "" # the subpath of your site, e.g. "/blog"
repository               : "essentialols/essentialols.github.io"
future                   : true
atom_feed:
  path                   : # blank (default) uses feed.xml

# SEO Related
google_site_verification :
bing_site_verification   :
alexa_site_verification  :
yandex_site_verification :

# Social Sharing
og_image                 : "profile.png" # Open Graph default share image
# For specifying social profiles
# - https://developers.google.com/structured-data/customize/social-profiles
social:
  type                   : Person
  name                   : "Ingmar Sturm"
  job_title              : "Survey Methodologist and Data Scientist"
  knows_about:
    - "Survey methodology"
    - "Survey data quality"
    - "Respondent quality and fraud detection"
    - "Questionnaire design"
    - "Quantitative research"
    - "Applied statistics"
    - "Survey weighting"
    - "Experimental design"
    - "Research automation"
    - "Data science"
  links:
    - "https://www.linkedin.com/in/ingmar-sturm"
    - "https://github.com/essentialols"
    - "https://scholar.google.com/citations?user=0KvXticAAAAJ&hl=en"
    - "https://orcid.org/0000-0002-3358-2970"


# Site Author
author:
  name             : "Ingmar Sturm"
  avatar           : "profile.png"
  bio              : "Quantitative research · Survey measurement · Data science"
  location         : "San Francisco, CA"
  email            : "contact@ingmarsturm.com"
  github           : "essentialols"
  linkedin         : "ingmar-sturm"
  googlescholar    : "https://scholar.google.com/citations?user=0KvXticAAAAJ&hl=en"
  orcid            : "https://orcid.org/0000-0002-3358-2970"


# Reading Files
include:
  - _pages
  - files
exclude:
  # Not published: local teaching material and CV working files. Jekyll reads
  # the working directory, so .gitignore alone does not keep these out of a build.
  - courses
  - cv-source
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - CHANGELOG
  - Capfile
  - Gemfile
  - Gruntfile.js
  - LICENSE
  - README
  - Rakefile
  - config
  - gulpfile.js
  - log
  - node_modules
  - package.json
  - tmp
  - vendor
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"


# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false


# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false


# Collections
collections: {}


# Defaults: pages without an explicit layout get the only layout left (v3).
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: v3

# Sass/SCSS (v3.scss is self-contained; no partials directory)
sass:
  style: compressed # http://sass-lang.com/documentation/file.SASS_REFERENCE.html#output_style


# Outputting
permalink: /:categories/:title/
# paginate: 5 # amount of posts to show
# paginate_path: /page:num/
timezone: America/Los_Angeles # http://en.wikipedia.org/wiki/List_of_tz_database_time_zones


# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-redirect-from
# mimic GitHub Pages with --safe
whitelist:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji


# HTML Compression
# - http://jch.penibelst.de/
compress_html:
  clippings: all
  ignore:
    envs: development

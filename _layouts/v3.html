---
layout: compress
---
{% include base_path %}
<!doctype html>
<html lang="{{ site.locale | slice: 0,2 }}">
  <head>
    <meta charset="utf-8">
    {% include seo.html %}
    <link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ base_path }}/feed.xml{% endif %}" type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,400&display=swap">
    <link rel="stylesheet" href="{{ base_path }}/assets/css/v3.css?v={{ site.time | date: '%s' }}">
    {% include v3/favicons.html %}
  </head>
  <body class="v3{% if page.v3_home %} v3--home{% endif %}">
    {% if page.v3_home %}
      {{ content }}
    {% else %}
      {% include v3/page-header.html %}
      <main class="v3-main">
        {{ content }}
      </main>
    {% endif %}
    {% include v3/footer.html %}
  </body>
</html>

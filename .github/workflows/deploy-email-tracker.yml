name: Deploy email tracker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'email-tracking-worker/**'
      - '.github/workflows/deploy-email-tracker.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: email-tracking-worker
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: email-tracking-worker/package-lock.json
      - run: npm ci
      - name: Validate Worker
        run: npm run check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Attach t.ingmarsturm.com
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          curl --silent --show-error --fail-with-body \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains" \
            --request PUT \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Content-Type: application/json" \
            --data '{"hostname":"t.ingmarsturm.com","service":"ingmar-email-tracker","zone_name":"ingmarsturm.com"}'
      - name: Verify tracker health
        run: |
          for attempt in $(seq 1 30); do
            if curl --silent --show-error --fail "https://t.ingmarsturm.com/health"; then
              echo
              echo "Tracker is healthy."
              exit 0
            fi
            sleep 3
          done
          echo "Tracker custom domain did not become healthy within 90 seconds." >&2
          exit 1
      - name: Smoke test open and click tracking
        id: smoke
        continue-on-error: true
        run: |
          set -euo pipefail
          BASE="https://t.ingmarsturm.com"
          TOKEN="$(node -e "console.log(require('crypto').randomBytes(18).toString('base64url'))")"

          curl --silent --show-error --fail "${BASE}/o/${TOKEN}.gif" --output /dev/null

          SITE_STATUS="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "${BASE}/c/site/${TOKEN}")"
          test "${SITE_STATUS}" = "302"

          LINKEDIN_STATUS="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "${BASE}/c/linkedin/${TOKEN}")"
          test "${LINKEDIN_STATUS}" = "302"

          for attempt in $(seq 1 15); do
            STATUS="$(curl --silent --show-error --fail "${BASE}/s/${TOKEN}")"
            if node -e '
              const s = JSON.parse(process.argv[1]);
              const ok = s.open.count >= 1 && s.site_click.count >= 1 && s.linkedin_click.count >= 1;
              process.exit(ok ? 0 : 1);
            ' "${STATUS}"; then
              echo "Tracking smoke test passed: ${STATUS}"
              exit 0
            fi
            sleep 2
          done

          echo "Tracking events did not all persist in time." >&2
          curl --silent --show-error --fail "${BASE}/s/${TOKEN}" || true
          exit 1
      - name: Record smoke-test result
        if: always()
        env:
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          cd ..
          mkdir -p .deploy-status
          node - <<'NODE'
          const fs = require('fs');
          const data = {
            service: 'email-tracker',
            smoke_test: process.env.SMOKE_OUTCOME,
            source_sha: process.env.SOURCE_SHA,
            run_id: process.env.RUN_ID,
            checked_at: new Date().toISOString(),
            checks: ['health', 'open', 'site_click', 'linkedin_click', 'kv_persistence']
          };
          fs.writeFileSync('.deploy-status/email-tracker.json', JSON.stringify(data, null, 2) + '\n');
          NODE
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .deploy-status/email-tracker.json
          git commit -m "chore: record email tracker smoke test [skip ci]" || exit 0
          git push
      - name: Fail if smoke test failed
        if: steps.smoke.outcome != 'success'
        run: exit 1
